trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  nodeVersion: '20.x'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

stages:

# ─────────────────────────────────────────
# STAGE 1: BUILD & TEST .NET CORE
# ─────────────────────────────────────────
- stage: Build_DotNet
  displayName: 'Build & Test .NET Core'
  jobs:
  - job: BuildJob
    displayName: 'Build .NET Core App'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests'
      inputs:
        command: 'test'
        projects: '**/*Tests/*.csproj'
        arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'

    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

    - task: DotNetCoreCLI@2
      displayName: 'Publish .NET App'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/dotnet'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Upload .NET Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/dotnet'
        ArtifactName: 'dotnet-drop'

# ─────────────────────────────────────────
# STAGE 2: BUILD REACT APP
# ─────────────────────────────────────────
- stage: Build_React
  displayName: 'Build React App'
  dependsOn: []   # runs in parallel with .NET stage
  jobs:
  - job: ReactBuild
    displayName: 'Build React Frontend'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd frontend
        npm ci
      displayName: 'Install npm Packages'

    - script: |
        cd frontend
        npm run build
      displayName: 'Build React App'

    - task: PublishBuildArtifacts@1
      displayName: 'Upload React Artifact'
      inputs:
        PathtoPublish: 'frontend/build'
        ArtifactName: 'react-drop'

# ─────────────────────────────────────────
# STAGE 3: DATABASE - SQL MIGRATION
# ─────────────────────────────────────────
- stage: Database_Migration
  displayName: 'Run SQL Migrations'
  dependsOn:
    - Build_DotNet
    - Build_React
  condition: succeeded()
  jobs:
  - job: SqlMigration
    displayName: 'EF Core Migration'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - script: |
        dotnet tool install --global dotnet-ef
        dotnet ef database update --project src/YourProject.Infrastructure --startup-project src/YourProject.API
      displayName: 'Apply EF Core Migrations'
      env:
        ConnectionStrings__DefaultConnection: $(DB_CONNECTION_STRING)  # set in pipeline variables

# ─────────────────────────────────────────
# STAGE 4: DEPLOY TO AZURE
# ─────────────────────────────────────────
- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Database_Migration
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployApp
    displayName: 'Deploy to Azure App Service'
    environment: 'Production'
    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'specific'
              artifactName: 'dotnet-drop'
              downloadPath: '$(System.ArtifactDirectory)'

          - task: AzureWebApp@1
            displayName: 'Deploy .NET API to App Service'
            inputs:
              azureSubscription: 'YOUR_SERVICE_CONNECTION'   # replace this
              appType: 'webAppLinux'
              appName: 'your-app-service-name'               # replace this
              package: '$(System.ArtifactDirectory)/dotnet-drop/*.zip'
              runtimeStack: 'DOTNETCORE|8.0'