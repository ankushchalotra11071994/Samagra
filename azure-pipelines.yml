 # ─── कब चलेगी ───
trigger:
  branches:
    include:
      - main            # main में push होते ही CI चलेगा

pr:
  branches:
    include:
      - main            # main में PR आने पर भी चलेगा

pool:
  vmImage: 'ubuntu-latest'   # Microsoft का Linux machine

variables:
  buildConfiguration: 'Release'
  solution: 'BackEnd/Samagra.slnx'

stages:
# ─── STAGE 1: CI - Build & Test .NET ───
- stage: Build_DotNet
  displayName: 'Build & Test .NET'
  jobs:
  - job: BuildJob
    displayName: 'Build, Test, Publish API'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - script: dotnet restore $(solution)
      displayName: 'Restore NuGet packages'

    - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
      displayName: 'Build solution'

    - script: >
        dotnet test BackEnd/tests/Samagra.Application.Tests/Samagra.Application.Tests.csproj
        --configuration $(buildConfiguration) --no-build
        --logger trx --results-directory $(Agent.TempDirectory)/TestResults
      displayName: 'Run unit tests'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()      # test fail हों तब भी report दिखे
      inputs:
        testResultsFormat: 'VSTest'
        searchFolder: '$(Agent.TempDirectory)/TestResults'
        testResultsFiles: '**/*.trx'

    - script: >
        dotnet publish BackEnd/Samagra.API/Samagra.API.csproj
        --configuration $(buildConfiguration) --no-build
        --output $(Build.ArtifactStagingDirectory)/api
      displayName: 'Publish API'

    - task: PublishPipelineArtifact@1
      displayName: 'Upload API artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/api'
        artifact: 'api-drop'